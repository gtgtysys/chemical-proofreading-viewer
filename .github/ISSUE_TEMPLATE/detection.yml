name: 誤検出・見逃し
description: 正しい表記が指摘された、または誤りが指摘されなかった
title: "[判定] "
body:
  - type: markdown
    attributes:
      value: |
        この報告は公開されます。勤務先のPDF・抽出テキスト・校正結果JSON/CSVは添付せず、自作の短い例で説明してください。
  - type: textarea
    id: result
    attributes:
      label: 何が、どのように判定されましたか？
      description: 公開できる短い例と、実際の判定・期待する判定を書いてください。
    validations:
      required: true
