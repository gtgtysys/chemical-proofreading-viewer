<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>フィードバック — 化学PDF校正ビューア</title>
  <style>
    body { margin: 0; background: #f3f7f8; color: #18323e; font: 16px/1.8 system-ui, sans-serif; }
    main { max-width: 620px; margin: 32px auto; padding: 24px; background: white; border-radius: 10px; }
    h1 { font-size: 1.5rem; } a { color: #136b67; } li { margin: 10px 0; }
    .notice { color: #5d6b72; font-size: .9rem; }
    [hidden] { display: none !important; }
    @media(max-width: 760px) { main { margin: 16px; padding: 20px; } }
  </style>
</head>
<body><main>
  <a href="./">ビューアに戻る</a>
  <h1>フィードバック</h1>
  <p>何が起きて、どうなってほしかったかを教えてください。</p>
  <p class="notice">GitHubへの投稿は公開されます。機密PDFの内容は書かず、自作の短い例に置き換えてください。</p>
  <p id="feedbackStatus" role="status" hidden></p>
  <ul id="feedbackLinks" hidden>
    <li><a id="detectionLink" target="_blank" rel="noopener noreferrer">判定について</a></li>
    <li><a id="bugLink" target="_blank" rel="noopener noreferrer">動作について</a></li>
    <li><a id="featureLink" target="_blank" rel="noopener noreferrer">改善してほしいこと</a></li>
    <li><a id="issuesLink" target="_blank" rel="noopener noreferrer">ほかの報告を見る</a></li>
  </ul>
  <script type="module" src="./feedback.mjs"></script>
</main></body></html>
